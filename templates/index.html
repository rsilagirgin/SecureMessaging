    <style>
        .lock-logo { display: inline-block; vertical-align: middle; margin-right: 8px; color: #3b82f6; }
        #login-screen label { display: block; margin-top: 12px; margin-bottom: 4px; }
        .avatar-selection-wrapper { margin-top: 10px; margin-bottom: 10px; }
        
        .avatar-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px;

            flex: 1; padding: 30px 20px; font-size: 1.2rem; font-weight: 700;
            background: #f1f5f9; color: #0f172a; border: 2px solid #cbd5e1;
            border-radius: 12px; cursor: pointer; transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .choice-btn:hover { background: #e2e8f0; border-color: #2563eb; color: #2563eb; transform: translateY(-2px); }
        .back-to-choice-btn {
            background: none; border: none; color: #64748b; cursor: pointer;

        .next-btn {

        .info-tooltip-trigger:hover { background-color: #2563eb; }
        .info-tooltip-trigger::after {
            content: "• Plain: Clear text, no security.\A• Caesar: Symmetric cipher shifting characters by a fixed step (+4).\A• AES: Industrial symmetric block cipher using a secure single key (CBC Mode).\A• RSA: Advanced asymmetric framework using Public Key to encrypt and Private Key to decrypt.";
            white-space: pre-wrap; position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%); background-color: #0f172a; color: #f8fafc; padding: 12px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; line-height: 1.4; width: 260px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); opacity: 0; visibility: hidden; pointer-events: none; z-index: 100; transition: all 0.2s ease; font-family: 'Inter', sans-serif; text-align: left;

    <script>
    const GIZLI_ANAHTAR = "staj_projesi_ozel_sifresi_123";

    async function getAESKey(password) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
        );
        return await window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: enc.encode("proje_tuzu_degeri"),
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function encryptData(plainText) {
        const enc = new TextEncoder();
        const key = await getAESKey(GIZLI_ANAHTAR);
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv }, key, enc.encode(plainText)
        );
        
        // Tarayıcılar arası en güvenli Base64 dönüşüm yöntemi
        const ciphertextBase64 = btoa(String.fromCharCode.apply(null, new Uint8Array(encrypted)));
        const ivBase64 = btoa(String.fromCharCode.apply(null, iv));
        
        return { ciphertext: ciphertextBase64, iv: ivBase64 };
    }

    async function decryptData(ciphertextBase64, ivBase64) {
        // Eksik veya hatalı veri akışında atob'un çökmesini engelliyoruz
        if (!ciphertextBase64 || !ivBase64) {
            console.error("Eksik şifreli veri veya IV saptandı.");
            return "[Şifreli Veri Bozuk veya Eksik]";
        }

        try {
            const key = await getAESKey(GIZLI_ANAHTAR);
            const ciphertext = new Uint8Array(atob(ciphertextBase64).split("").map(c => c.charCodeAt(0)));
            const iv = new Uint8Array(atob(ivBase64).split("").map(c => c.charCodeAt(0)));
            
            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv }, key, ciphertext
            );
            return new TextDecoder().decode(decrypted);
        } catch (e) {
            console.error("Deşifre hatası:", e);
            return "[Şifre Çözülemedi - Geçersiz Anahtar]";
        }
    }

    // 🆕 SEKMELER ARASI GEÇİŞ MOTORU
    function switchChatView(viewType) {
    const chatBox = document.getElementById('chat-box');
    const cleanBtn = document.getElementById('view-clean-btn');
    const cipherBtn = document.getElementById('view-cipher-btn');
    
    if (viewType === 'clean') {
        chatBox.classList.remove('show-cipher');
        chatBox.classList.add('show-clean');
        cleanBtn.classList.add('active');
        cipherBtn.classList.remove('active');
    } else {
        chatBox.classList.remove('show-clean');
        chatBox.classList.add('show-cipher');
        cipherBtn.classList.add('active');
        cleanBtn.classList.remove('active');
    }
}
    // --- ŞİFRELEME MOTORU BURADA BİTTİ ---

    const socket = io();
    const joinBtn = document.getElementById('join-btn');
    const connectRoomBtn = document.getElementById('connect-room-btn');
    const sendBtn = document.getElementById('send-btn');
    const msgInput = document.getElementById('message-input'); 

    let globalUsername = "";
    let selectedAlgo = ""; 
    let selectedAvatar = "1";
    let isHacker = false; 
    let messageCounter = 0;
    
    let currentSelectedRoom = ""; 
    let currentRoomPIN = ""; 
    let currentRoomAlgo = ""; 
    let isPasswordVisible = false;

    // ✅ YENİ PROFiL GEÇİŞ FONKSİYONU
// ✅ KİLİTLENMEYİ ÖNLEYEN, GARANTİLİ GEÇİŞ FONKSİYONU
function goToChoiceStep() {
    let firstName = document.getElementById('firstname').value.trim();
    let lastName = document.getElementById('lastname').value.trim();
    const identityErr = document.getElementById('identity-error');
    
    if(!firstName || !lastName) {
        identityErr.className = "lobby-error-msg";
        identityErr.innerText = "Please enter both First Name and Last Name!";
        identityErr.classList.remove('hidden');
        return;
    }
    identityErr.classList.add('hidden');
    
    try {
        // İlk harfi büyütüp kalanını küçültüyoruz (Güvenli yöntem)
        let firstChar = firstName.charAt(0).toLocaleUpperCase('tr-TR');
        let restOfName = firstName.slice(1).toLocaleLowerCase('tr-TR');
        firstName = firstChar + restOfName;
        
        // Soyadın sadece ilk harfi ve nokta
        let lastChar = lastName.charAt(0).toLocaleUpperCase('tr-TR');
        const shortLastName = lastChar + ".";
        
        // Sonuç: "Sıla G."
        globalUsername = `${firstName} ${shortLastName}`; 
        
        // Ekranları değiştir
        document.getElementById('step-identity').classList.add('hidden');
        document.getElementById('step-choice').classList.remove('hidden');
        
    } catch (error) {
        console.error("İsim formatlama hatası:", error);
        // Eğer tarayıcı yerel lokali desteklemiyorsa düz fallback yapıya geçsin, uygulama çökmesin:
        firstName = firstName.charAt(0).toUpperCase() + firstName.slice(1).toLowerCase();
        const shortLastName = lastName.charAt(0).toUpperCase() + ".";
        globalUsername = `${firstName} ${shortLastName}`;
        
        document.getElementById('step-identity').classList.add('hidden');
        document.getElementById('step-choice').classList.remove('hidden');
    }
}

    function goToIdentityStep() {
        document.getElementById('step-choice').classList.add('hidden');
        document.getElementById('step-identity').classList.remove('hidden');
    }

    function selectLobbyAction(action) {
        document.getElementById('step-choice').classList.add('hidden');
        clearErrors();
        if(action === 'create') {
            document.getElementById('panel-create').classList.remove('hidden');
        } else {
            document.getElementById('panel-connect').classList.remove('hidden');
        }
    }

    function backToChoice() {
        document.getElementById('panel-create').classList.add('hidden');
        document.getElementById('panel-connect').classList.add('hidden');
        document.getElementById('step-choice').classList.remove('hidden');
        clearErrors();
    }

    function clearErrors() {
        document.getElementById('identity-error').classList.add('hidden');
        const leftErr = document.getElementById('left-error-container');
        const rightErr = document.getElementById('right-error-container');
        if(leftErr) { leftErr.classList.add('hidden'); leftErr.innerHTML = ""; }
        if(rightErr) { rightErr.classList.add('hidden'); rightErr.innerHTML = ""; }
    }

    function showLobbyError(side, text) {
        clearErrors();
        const container = document.getElementById(`${side}-error-container`);
        if(container) {
            container.className = "lobby-error-msg";
            container.innerText = text;
        }
    }

    function generateRandomPassword() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
        let newPassword = "";
        for (let i = 0; i < 12; i++) {
            newPassword += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('room-pass-create').value = newPassword;
        clearErrors();
    }

    function togglePasswordVisibility() {
        const displayDiv = document.getElementById('room-pin-display');

        if (isHacker) return;

    function escapeHTML(str) {
        if (!str) return "";
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    joinBtn.addEventListener('click', () => {
        const roomName = document.getElementById('room-name-input').value.trim();
        const roomPass = document.getElementById('room-pass-create').value.trim();
        selectedAlgo = document.getElementById('algo-select-create').value;

        if (!roomName) { showLobbyError('left', "Please enter a Room Name!"); return; }
        if (!roomPass) { showLobbyError('left', "Please create or generate a Password!"); return; }

        currentSelectedRoom = roomName;
        currentRoomPIN = roomPass; 
        currentRoomAlgo = selectedAlgo;
        socket.emit('create_room', { room_name: roomName, password: roomPass, algo: selectedAlgo });
    });

    socket.on('room_created_success', (data) => {
        enterChatView();
        socket.emit('join', { username: globalUsername, room_name: data.room_name, password: currentRoomPIN, avatar: selectedAvatar });
    });

    connectRoomBtn.addEventListener('click', () => {
        const roomPass = document.getElementById('room-pass-join').value.trim();
        const userSelectedAlgo = document.getElementById('algo-select-connect').value;

        if (!currentSelectedRoom) { showLobbyError('right', "Please select a room from the list!"); return; }
        if (userSelectedAlgo.toLowerCase() !== currentRoomAlgo.toLowerCase()) {
            showLobbyError('right', `❌ You are not using the room's encryption protocol! Please set your decryption algorithm to '${currentRoomAlgo.toUpperCase()}'.`);
            return;
        }
        if (!roomPass) { showLobbyError('right', "Please enter the room password!"); return; }

        selectedAlgo = userSelectedAlgo; 
        socket.emit('join', { username: globalUsername, room_name: currentSelectedRoom, password: roomPass, avatar: selectedAvatar });
    });

    socket.on('error', (data) => {
        if (data.side) { showLobbyError(data.side, data.msg); } else { showLobbyError('right', data.msg); }
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('chat-screen').classList.add('hidden');
        document.getElementById('nav-modes').classList.add('hidden');
    });

    socket.on('status', (data) => {
        if(!document.getElementById('login-screen').classList.contains('hidden') && !isHacker) { enterChatView(); }
        let chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div class="status-msg-row"><div class="status-msg">${data.msg}</div></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Butonların aktiflik durumunu kontrol eden fonksiyon
    function updateToolButtonsState() {
        const tools = [
            { id: 'bold-btn', command: 'bold' },
            { id: 'italic-btn', command: 'italic' },
            { id: 'underline-btn', command: 'underline' }
        ];

        tools.forEach(tool => {
            const btn = document.getElementById(tool.id);
            if (btn) {
                // queryCommandState seçili alanda ilgili komutun aktif olup olmadığını döner (true/false)
                if (document.queryCommandState(tool.command)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        });
    }

    function formatText(command) {
        document.execCommand(command, false, null);
        msgInput.focus();
        updateToolButtonsState(); // Biçimlendirme yapılınca buton durumlarını güncelle
    }

    // Mevcut event listener'lar
    document.getElementById('bold-btn').addEventListener('click', (e) => { e.preventDefault(); formatText('bold'); });
    document.getElementById('italic-btn').addEventListener('click', (e) => { e.preventDefault(); formatText('italic'); });
    document.getElementById('underline-btn').addEventListener('click', (e) => { e.preventDefault(); formatText('underline'); });

    // 🆕 Kullanıcı metin alanında yazarken veya tıkladığında imlecin olduğu yerin durumunu dinle
    msgInput.addEventListener('keyup', updateToolButtonsState);
    msgInput.addEventListener('click', updateToolButtonsState);
    
    // Mesaj gönderildikten sonra butonların temizlenmesi için sendBtn click event'inin içine 
    // msgInput.innerHTML = ""; satırının hemen altına şunu ekleyebilirsin:
    // updateToolButtonsState();

    // 🔒 GÜVENLİ VE UYUMLU MESAJ GÖNDERİMİ
    sendBtn.addEventListener('click', async () => {
        let message = msgInput.innerHTML.trim();
        
        if (msgInput.innerText.trim() === "") message = "";

        if (message !== "") {
            // Mesajı daha lokaldeyken şifreliyoruz
            const encryptedResult = await encryptData(message);

            // Backend ve eski karşılayıcı altyapıyla tam uyumlu parametre isimleri
            socket.emit('message', { 
                username: globalUsername, 
                encrypted: encryptedResult.ciphertext, // 'data.encrypted' arayan yapılar için eşitlendi
                iv: encryptedResult.iv, 
                algo: currentRoomAlgo, 
                avatar: selectedAvatar, 
                room_name: currentSelectedRoom 
            });
            msgInput.innerHTML = ""; 
        }
    });

    msgInput.addEventListener("keydown", (event) => { 
        if (event.key === "Enter" && !event.shiftKey) { 
            event.preventDefault(); 
            sendBtn.click(); 
        } 
    });

    function enterChatView() {
        clearErrors();
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');
        document.getElementById('nav-modes').classList.remove('hidden');
        document.getElementById('room-title').innerText = `Room: ${currentSelectedRoom.toUpperCase()} (${currentRoomAlgo.toUpperCase()} Mode)`;
        document.getElementById('room-pin-display').innerText = "Key: ••••••••";
        isPasswordVisible = false;
    }
    // 🚪 ODADAN ÇIKMA VE LOBİYE DÖNME MOTORU
    function exitCurrentRoom() {
        if (!currentSelectedRoom) return;

        // 1. Sunucuya bu odadan ayrıldığımızı haber veriyoruz (Backend mekanizman için)
        socket.emit('leave', { 
            username: globalUsername, 
            room_name: currentSelectedRoom 
        });

        // 2. Chat ekranını gizleyip, lobi seçim adımını (step-choice) görünür yapıyoruz
        document.getElementById('chat-screen').classList.add('hidden');
        document.getElementById('nav-modes').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
        
        // Doğrudan "Create / Connect" butonlarının olduğu panele paslıyoruz
        document.getElementById('step-identity').classList.add('hidden');
        document.getElementById('panel-create').classList.add('hidden');
        document.getElementById('panel-connect').classList.add('hidden');
        document.getElementById('step-choice').classList.remove('hidden');

        // 3. İçeride kalan eski mesajları temizleyelim ki yeni odaya girince çorba olmasın
        document.getElementById('chat-box').innerHTML = "";

        // 4. Odadan çıktığımız için mevcut oda değişkenlerini sıfırlıyoruz
        currentSelectedRoom = "";
        currentRoomPIN = "";
        currentRoomAlgo = "";
        
        // Eğer hacker modundaysak lobiye dönünce normal moda geri çekelim
        if (isHacker) {
            isHacker = false;
            document.getElementById('main-container').classList.remove('hacker-mode-active');
            document.getElementById('input-area-wrapper').classList.remove('hidden');
            document.getElementById('view-switcher-wrapper').classList.remove('hidden');
            document.getElementById('hacker-mode-btn').classList.remove('active');
            const secureStatus = document.getElementById('secure-mode-status');
            if (secureStatus) {
                secureStatus.innerText = "🔒 Secure Chat Line Active";
                secureStatus.style.color = ""; 
            }
        }
    }
    // 🏠 LOGOYA BASILDIĞINDA ANASAYFAYA DÖNÜŞ VE SIFIRLAMA MOTORU
    function confirmMainPageReturn() {
        const response = confirm("Are you sure you want to log out and return to the main entry page?");
        if (response) {
            // Eğer bir odadaysak önce soket bağlantısını temizce koparalım
            if (currentSelectedRoom) {
                socket.emit('leave', { username: globalUsername, room_name: currentSelectedRoom });
            }
            // Sayfayı tamamen ilk haline yeniler, lobi kimlik giriş ekranına tertemiz atar
            window.location.reload();
        }
    }

    // 🔒 GÜVENLİ VE UYUMLU DEŞİFRE KARŞILAYICISI
   // 🔒 SOKET MESAJ KARŞILAYICI GÜNCELLEMESİ

// 🔒 SOKET MESAJ KARŞILAYICI GÜNCELLEMESİ
socket.on('message', async (data) => {
    if (isHacker && !data.is_hacker_data) return;
    if (!isHacker && data.is_hacker_data) return;
    let chatBox = document.getElementById('chat-box');
    messageCounter++;
    let isMe = (data.username === globalUsername);
    let messageClass = isMe ? 'my-msg' : 'other-msg';
    let msgAvatar = data.avatar || "1";
    let avatarHtml = `<img src="/static/avatars/${msgAvatar}.jpg" class="chat-avatar" alt="avatar">`;
    
    let decryptedOriginal = "[Şifre Çözülemedi]";
    if (!isHacker) {
        decryptedOriginal = await decryptData(data.encrypted, data.iv);
    }
    
    let displayUsername = data.username;
    if (displayUsername) {
        displayUsername = displayUsername.replace(/_\d+$/, '').replace(/\.$/, '');
    }
    
    // 🕒 ARTIK SAATİ BACKEND'DEN GELEN VERİDEN ÇEKİYORUZ!
    // Eğer backend'den anlık bir hata payıyla boş gelirse diye "00:00" fallback'i koyduk.
    const messageTime = data.time || "00:00";
    const timeHtml = `<span class="message-time">${messageTime}</span>`;
    
    let messageContent = "";
    if (isHacker) {
        messageContent = `<strong>Line Sniffer:</strong><div class="encrypted-text">[TRAFFIC ALERT - ${data.algo}]: ${escapeHTML(data.encrypted)}</div>${timeHtml}`;
    } else {
        if (isMe) {
            messageContent = `${avatarHtml}<strong>${escapeHTML(displayUsername)}:</strong> <span class="user-text-content">${decryptedOriginal}</span><div class="encrypted-text encrypted-text-zone">[${data.algo} Raw Data]: ${escapeHTML(data.encrypted)}</div>${timeHtml}`;
        } else {
            let systemMatch = (data.algo.toLowerCase() === currentRoomAlgo.toLowerCase());
            if (systemMatch) {
                messageContent = `${avatarHtml}<strong>${escapeHTML(displayUsername)}:</strong> <span class="user-text-content">${decryptedOriginal}</span><div class="encrypted-text encrypted-text-zone">[${data.algo} Raw Data]: ${escapeHTML(data.encrypted)}</div>${timeHtml}`;
            } else {
                messageContent = `${avatarHtml}<strong>${escapeHTML(displayUsername)}:</strong> <span class="user-text-content" style="color: #dc2626; font-weight: bold;">[❌ DECRYPTION FAILED: Key Mismatch]</span><div class="encrypted-text encrypted-text-zone">[${data.algo} Raw Data]: ${escapeHTML(data.encrypted)}</div>${timeHtml}`;
            }
        }
    }
    chatBox.innerHTML += `<div class="msg-wrapper ${messageClass}"><div class="msg-item">${messageContent}</div></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
});
