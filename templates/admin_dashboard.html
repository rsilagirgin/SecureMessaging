<h2>Admin Paneli - Yeni Kullanıcı Tanımla</h2>
<form method="POST">
    <input type="text" name="new_username" placeholder="Yeni Kullanıcı Adı" required><br>
    <input type="text" name="new_password" placeholder="Yeni Şifre" required><br>
    <button type="submit">Kullanıcıyı Oluştur</button>
</form>

<h3>Mevcut Kullanıcılar:</h3>
<ul>
    {% for user in users %}
        <li>{{ user }}</li>
    {% endfor %}
</ul>
<a href="/logout">Çıkış Yap</a>
